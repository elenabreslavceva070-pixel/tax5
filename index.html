<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>НДС-посредник | Тренажёр</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eef2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
            padding: 12px;
        }

        .messenger {
            max-width: 700px;
            width: 100%;
            background: #FFFFFF;
            border-radius: 24px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.12);
            overflow: hidden;
        }

        .chat-header {
            background: #FFFFFF;
            padding: 10px 16px 8px 16px;
            border-bottom: 1px solid rgba(100, 160, 210, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #95CAFA, #7bb5df);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }
        .chat-info h2 {
            font-size: 1rem;
            font-weight: 600;
            color: #1a2c3e;
        }
        .chat-info h2 span {
            font-weight: 500;
            background: #ecf7ff;
            padding: 1px 6px;
            border-radius: 30px;
            font-size: 0.6rem;
            margin-left: 6px;
        }
        .chat-info p {
            font-size: 0.68rem;
            color: #5e7a93;
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .online-dot {
            width: 6px;
            height: 6px;
            background: #2fc96b;
            border-radius: 6px;
        }

        .messages-area {
            background: #FEFEFE;
            padding: 12px 14px 8px 14px;
            min-height: 360px;
            max-height: 420px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            display: flex;
            max-width: 88%;
        }
        .client-message { align-self: flex-start; }
        .client-message .bubble {
            background: #F1F5F9;
            border-radius: 16px 16px 16px 6px;
            border: 1px solid #e2ecf5;
        }
        .user-message { align-self: flex-end; }
        .user-message .bubble {
            background: #ECF5FC;
            border-radius: 16px 16px 6px 16px;
            border: 1px solid #cde0ef;
        }
        .bubble {
            padding: 8px 12px;
            font-size: 0.82rem;
            line-height: 1.4;
            color: #1e2e3c;
        }
        .message-meta {
            font-size: 0.6rem;
            margin-top: 4px;
            margin-left: 8px;
            margin-right: 8px;
            color: #8da0b2;
            display: flex;
            gap: 6px;
        }
        .client-message .message-meta { justify-content: flex-start; }
        .user-message .message-meta { justify-content: flex-end; }

        .options-panel {
            background: #FFFFFF;
            border-top: 1px solid #e9eff5;
            padding: 12px 14px 10px;
        }
        .options-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            font-weight: 600;
            color: #5e7a93;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .options-title::before { content: "⚡"; font-size: 11px; }
        .options-grid { display: flex; flex-direction: column; gap: 8px; }
        .option-btn {
            width: 100%;
            background: transparent;
            border: 1.5px solid #cde2f5;
            border-radius: 20px;
            padding: 8px 14px;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 500;
            text-align: left;
            color: #1e2f3e;
            cursor: pointer;
            transition: all 0.15s;
            background: #FFFFFF;
            line-height: 1.3;
        }
        .option-btn:hover {
            background: #F4FAFF;
            border-color: #9bc6ec;
        }
        .options-disabled .option-btn {
            opacity: 0.55;
            cursor: default;
            pointer-events: none;
        }

        .analysis-card {
            margin: 8px 14px 14px 14px;
            border-radius: 14px;
            padding: 8px 12px;
            font-size: 0.75rem;
            line-height: 1.4;
        }
        .analysis-card.correct {
            background-color: #e8f5e9;
            border-left: 4px solid #2c9b5e;
            color: #155724;
        }
        .analysis-card.wrong {
            background-color: #ffeaea;
            border-left: 4px solid #dc3545;
            color: #8b2c2c;
        }
        .feedback-footnote {
            margin-top: 8px;
            font-size: 0.65rem;
            text-align: center;
            color: #9ab3cc;
            border-top: 1px solid #ecf3f9;
            padding-top: 8px;
        }
        .reset-button-container {
            padding: 8px 14px 14px 14px;
            background: #FFFFFF;
            border-top: 1px solid #ecf3f9;
            text-align: center;
        }
        .reset-chat {
            background: #f8fafd;
            border: 1px solid #cde2f5;
            border-radius: 32px;
            padding: 6px 16px;
            font-size: 0.75rem;
            font-weight: 500;
            font-family: inherit;
            color: #22668d;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .reset-chat:hover {
            background: #eef5fc;
        }
        .messages-area::-webkit-scrollbar { width: 4px; }
        .messages-area::-webkit-scrollbar-track { background: #ECF3F9; border-radius: 6px; }
        .messages-area::-webkit-scrollbar-thumb { background: #95CAFA; border-radius: 6px; }

        @media (max-width: 500px) {
            .message { max-width: 94%; }
            .option-btn { padding: 6px 12px; font-size: 0.75rem; }
            .bubble { font-size: 0.78rem; padding: 6px 10px; }
            .messages-area { padding: 10px 12px; }
        }
    </style>
</head>
<body>
<div class="messenger" id="messengerApp">
    <div class="chat-header">
        <div class="avatar">👔</div>
        <div class="chat-info">
            <h2>Алексей Михайлович <span>клиент</span></h2>
            <p><span class="online-dot"></span> онлайн</p>
        </div>
    </div>

    <div class="messages-area" id="messagesArea"></div>

    <div class="options-panel" id="optionsPanel">
        <div class="options-title">Ваш ответ</div>
        <div class="options-grid" id="optionsContainer"></div>
        <div class="feedback-footnote" id="footnoteMsg">Выберите вариант ответа</div>
    </div>

    <div id="analysisContainer"></div>

    <div class="reset-button-container">
        <button class="reset-chat" id="resetChatBtn">⟳ Начать заново</button>
    </div>
</div>

<script>
    const messagesContainer = document.getElementById('messagesArea');
    const optionsContainerDiv = document.getElementById('optionsContainer');
    const optionsPanel = document.getElementById('optionsPanel');
    const footnoteEl = document.getElementById('footnoteMsg');
    const analysisDiv = document.getElementById('analysisContainer');

    let currentState = { locked: false };

    function scrollToBottom() {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function addMessage(text, sender = 'user') {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${sender === 'client' ? 'client-message' : 'user-message'}`;
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerText = text;
        const metaSpan = document.createElement('div');
        metaSpan.className = 'message-meta';
        const now = new Date();
        const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        metaSpan.innerText = sender === 'client' ? `Клиент · ${timeStr}` : `Вы · ${timeStr}`;
        messageDiv.appendChild(bubble);
        messageDiv.appendChild(metaSpan);
        messagesContainer.appendChild(messageDiv);
        scrollToBottom();
        return messageDiv;
    }

    function clearOptions() { optionsContainerDiv.innerHTML = ''; }
    function disableOptions(disabled = true) {
        if (disabled) optionsPanel.classList.add('options-disabled');
        else optionsPanel.classList.remove('options-disabled');
    }

    function showAnalysis(text, type = 'wrong') {
        analysisDiv.innerHTML = '';
        const card = document.createElement('div');
        card.className = `analysis-card ${type === 'correct' ? 'correct' : 'wrong'}`;
        card.innerHTML = `<strong>${type === 'correct' ? '✓ Верно' : '✗ Разбор'}</strong><br>${text}`;
        analysisDiv.appendChild(card);
        scrollToBottom();
    }

    function clearAnalysis() { analysisDiv.innerHTML = ''; }

    function finishWithAnalysis(analysisText, isCorrect = false) {
        currentState.locked = true;
        disableOptions(true);
        clearOptions();
        showAnalysis(analysisText, isCorrect ? 'correct' : 'wrong');
        footnoteEl.innerHTML = 'Диалог завершён. Нажмите «Начать заново».';
    }

    function createButton(text, onClick) {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = text;
        btn.addEventListener('click', () => { if (!currentState.locked) onClick(); });
        optionsContainerDiv.appendChild(btn);
    }

    // --- СЦЕНАРИЙ ---
    function startDialog() {
        addMessage('Добрый день! Налоговая запросила пояснения по посреднической операции. Завтра нужно явиться с документами. Документов нет, часть у контрагента. Можете сразу подготовить ответ?', 'client');
        showFirstChoice();
    }

    function showFirstChoice() {
        clearOptions();
        createButton('Давайте разберем, пришлите что есть, остальное уточним', () => {
            addMessage('Давайте разберем, пришлите что есть, остальное уточним', 'user');
            startBranchA();
        });
        createButton('Нужен полный пакет документов, без него ответ не подготовить', () => {
            addMessage('Нужен полный пакет документов, без него ответ не подготовить', 'user');
            startBranchB();
        });
        footnoteEl.innerHTML = 'Выберите ответ';
    }

    // ВЕТКА A (ошибочная — работа без документов)
    function startBranchA() {
        setTimeout(() => {
            addMessage('Хорошо, отправляю. Времени мало', 'client');
            setTimeout(() => {
                addMessage('По одной сделке документов нет, но там стандартно, посредническая', 'client');
                setTimeout(() => showBranchAChoice(), 600);
            }, 500);
        }, 400);
    }

    function showBranchAChoice() {
        clearOptions();
        createButton('Учту по описанию, подготовлю ответ', () => {
            addMessage('Учту по описанию, подготовлю ответ', 'user');
            continueBranchA();
        });
        createButton('Нужно уточнить документы по этой сделке', () => {
            addMessage('Нужно уточнить документы по этой сделке', 'user');
            continueBranchA();
        });
        footnoteEl.innerHTML = 'Нет документов по сделке';
    }

    function continueBranchA() {
        setTimeout(() => {
            addMessage('Я подготовил ответ. Направляю', 'user');
            setTimeout(() => {
                addMessage('Спасибо. Можете сами съездить в инспекцию? Так быстрее', 'client');
                setTimeout(() => showBranchAFinalChoice(), 600);
            }, 500);
        }, 500);
    }

    function showBranchAFinalChoice() {
        clearOptions();
        createButton('Хорошо, уточню в инспекции и передам документы', () => {
            addMessage('Хорошо, уточню в инспекции и передам документы', 'user');
            setTimeout(() => {
                addMessage('Отлично. Объясните, что у нас посредническая схема', 'client');
                setTimeout(() => {
                    finishWithAnalysis('Ошибка: согласились работать без полного пакета документов + представлять интересы без доверенности. Это может исказить суть сделки и вызвать проблемы с налоговой.', false);
                }, 500);
            }, 400);
        });
        createButton('Я могу взаимодействовать с инспекцией только по доверенности', () => {
            addMessage('Я могу взаимодействовать с инспекцией только по доверенности', 'user');
            setTimeout(() => {
                addMessage('Понял, тогда сами', 'client');
                setTimeout(() => {
                    finishWithAnalysis('Верно отказались от поездки без доверенности, но изначально ошиблись — согласились работать без полного пакета документов, что ведёт к рискам.', false);
                }, 500);
            }, 400);
        });
        footnoteEl.innerHTML = 'Клиент просит поехать в инспекцию';
    }

    // ВЕТКА B (требование документов)
    function startBranchB() {
        setTimeout(() => {
            addMessage('Понимаю, но времени мало. Можем ускориться? Доплачу', 'client');
            setTimeout(() => showBranchBFork(), 500);
        }, 400);
    }

    function showBranchBFork() {
        clearOptions();
        createButton('Без полного комплекта документов ответ подготовить нельзя', () => {
            addMessage('Без полного комплекта документов ответ подготовить нельзя', 'user');
            continueBranchBCorrect();
        });
        createButton('Ладно, начну подготовку даже с неполными данными', () => {
            addMessage('Ладно, начну подготовку даже с неполными данными', 'user');
            transitionToBranchAFromB();
        });
        footnoteEl.innerHTML = 'Клиент предлагает доплату';
    }

    function continueBranchBCorrect() {
        setTimeout(() => {
            addMessage('Ок, собираем. Часть документов у контрагента, будут позже', 'client');
            setTimeout(() => {
                addMessage('Отправили всё, что нашли. Но по одному договору нет подписанного приложения', 'client');
                setTimeout(() => showBranchBFinalChoice(), 700);
            }, 600);
        }, 500);
    }

    function showBranchBFinalChoice() {
        clearOptions();
        createButton('Начинаю готовить ответ на текущих документах', () => {
            addMessage('Начинаю готовить ответ на текущих документах', 'user');
            setTimeout(() => {
                addMessage('Ждём результат', 'client');
                setTimeout(() => {
                    finishWithAnalysis('Ошибка: работа без полного пакета (отсутствует приложение к договору). При проверке ФНС это критично — ответ теряет доказательную силу.', false);
                }, 500);
            }, 400);
        });
        createButton('Без подписанного приложения ответ нельзя. Запросите документ', () => {
            addMessage('Без подписанного приложения ответ нельзя. Запросите документ', 'user');
            setTimeout(() => {
                addMessage('Понял, запрашиваем. Это займёт пару дней', 'client');
                setTimeout(() => {
                    finishWithAnalysis('Правильно: вы отказались работать без полного комплекта. Без документов ответ не имеет доказательной силы. Вы сохранили юридическую чистоту консультации.', true);
                }, 500);
            }, 400);
        });
        footnoteEl.innerHTML = 'Отсутствует подписанное приложение';
    }

    // Переход из B в A (ошибка)
    function transitionToBranchAFromB() {
        setTimeout(() => {
            addMessage('Ок, отправляю что есть. Времени мало', 'client');
            setTimeout(() => {
                addMessage('По одной сделке документов нет, там стандартно', 'client');
                setTimeout(() => showTransitionChoice(), 600);
            }, 500);
        }, 400);
    }

    function showTransitionChoice() {
        clearOptions();
        createButton('Учту по описанию, подготовлю ответ', () => {
            addMessage('Учту по описанию, подготовлю ответ', 'user');
            continueTransition();
        });
        createButton('Нужно уточнить документы по этой сделке', () => {
            addMessage('Нужно уточнить документы по этой сделке', 'user');
            continueTransition();
        });
        footnoteEl.innerHTML = 'Нет документов по сделке';
    }

    function continueTransition() {
        setTimeout(() => {
            addMessage('Я подготовил ответ. Направляю', 'user');
            setTimeout(() => {
                addMessage('Спасибо. Можете сами съездить в инспекцию?', 'client');
                setTimeout(() => showTransitionFinalChoice(), 600);
            }, 500);
        }, 500);
    }

    function showTransitionFinalChoice() {
        clearOptions();
        createButton('Хорошо, уточню и передам документы', () => {
            addMessage('Хорошо, уточню и передам документы', 'user');
            setTimeout(() => {
                addMessage('Отлично, объясните про посредническую схему', 'client');
                setTimeout(() => {
                    finishWithAnalysis('Ошибка: нельзя представлять интересы без доверенности + работа без полного пакета документов. Это риск для клиента.', false);
                }, 500);
            }, 400);
        });
        createButton('Я могу взаимодействовать только по доверенности', () => {
            addMessage('Я могу взаимодействовать только по доверенности', 'user');
            setTimeout(() => {
                addMessage('Понял, тогда сами', 'client');
                setTimeout(() => {
                    finishWithAnalysis('Верно отказались от поездки, но изначально ошиблись — согласились работать без полного пакета документов, что ведёт к искажению пояснений.', false);
                }, 500);
            }, 400);
        });
        footnoteEl.innerHTML = 'Клиент просит поехать в инспекцию';
    }

    function fullReset() {
        currentState = { locked: false };
        messagesContainer.innerHTML = '';
        clearAnalysis();
        disableOptions(false);
        startDialog();
    }

    document.getElementById('resetChatBtn').addEventListener('click', fullReset);
    startDialog();
</script>
</body>
</html>
